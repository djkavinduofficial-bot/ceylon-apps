      - name: Build debug APK
        working-directory: ceylon-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p output
          cp ceylon-app/app/build/outputs/apk/debug/app-debug.apk output/Ceylon-App-Store-v1.0-debug.apk
          sha256sum output/Ceylon-App-Store-v1.0-debug.apk > output/SHA256SUMS.txt
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ceylon-App-Store-APK
          path: output/
          if-no-files-found: error

